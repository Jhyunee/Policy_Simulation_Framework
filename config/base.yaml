# All paths are relative to the Policy_Simulation_Cleaned working directory.
# This is a small starting run, not the historical experiment configuration.
llm:
  url: https://api.deepseek.com/v1/chat/completions
  api_key_env: DEEPSEEK_API_KEY
  auth_header: bearer
  model: deepseek-chat
  temperature: 0.3
  max_tokens: 8192
  request_timeout: 180
  max_retries: 3

paths:
  background_dir: dataset/kor/background
  input_policy_dir: dataset/kor/example/input_policy
  past_policy_dir: dataset/kor/example/input_policy
  processed_dir: dataset/processed
  outputs:
    stage1: outputs/stage1
    stage2_toc: outputs/stage2_toc

pdf:
  parser: pypdf
  fallback_to_pypdf: true
  cache_dir: dataset/processed/pdf_cache

kg:
  use_iad_ig_ontology: true
  chunk_size: 1200
  chunk_overlap: 200
  max_node_pool_context: 120
  max_edges_per_chunk: 20
  enable_validation_recovery: true

stage1:
  personas_per_category: 2
  use_economic_context: false
  use_economic_context_in_persona: false
  use_policy_plan: false
  use_policy_plan_in_context: false
  output_file: stage1_result.json
  non_actor_types: [Program, Organization, Person]

persona:
  sampler: scope_definer
  actor_anchor_policy: iad_actor
  personas_per_role: 100
  max_simulation_participants: 5
  simulation_sampling_strategy: role_stratified_weighted
  simulation_sample_seed: 42
  fallback_to_llm: false
  scope_definer:
    enabled: true
    values_module: dataset.processed.nemotron_kor
    parquet_glob: dataset/processed/nemotron_kor/Nemotron-Personas-Korea/data/*.parquet
    min_pool_size: 300
    target_pool_size: 300
    max_per_tier_occupation: 3
    candidate_pool_top_k: 100
    fallback:
      enabled: true
      mode: random_full_nemotron
    num_scenarios: 3
    participants_per_scenario: 5
  role_actions:
    enabled: true
  refiner:
    enabled: false
  # Used only when sampler is changed to kg_gen (no parquet required).
  kg_gen:
    country: kor
    personas_per_entity: 5
    temperature: 0.9

stage2_toc:
  prompt_variant: ko_natural
  sim_personas_per_entity: 2
  max_scenarios: 3
  run_forward: true
  run_backward: true
  sequential_backward: true
  final_forward_refinement: false
  fwd_bwd_fwd_seq: false
  fwd_bwd_fwd_bwd_seq: false
  phase_interaction_mode: independent
  parallel_forward_backward: false
  parallel_scenarios: false
  quantitative_target_only: false
  use_economic_context_in_simulation: false
  inner_schema_file: inner_schema.json
  output_file: stage2_toc_result.json

# Used only by build-zep/build-graph/dump-graph.
zep:
  api_key_env: ZEP_API_KEY
  chunk_size: 500
  chunk_overlap: 50
  batch_size: 3
  wait_timeout: 600
